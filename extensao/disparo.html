<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>Disparar produto</title>
<style>
/* Fonte embutida: extensao nao deve depender de rede para renderizar. */
@font-face{
  font-family:'Montserrat';
  src:url('fontes/montserrat.woff2') format('woff2');
  font-weight:400 900; font-style:normal; font-display:swap;
}

/* Mesmas variaveis do painel (tudo-sobre-promos/index.html). */
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--card:#222222;--card-deep:#151515;
  --border:#2e2e2e;--border-ctrl:#3a3a3a;
  --text:#f5f5f5;--muted:#888888;--muted2:#666666;
  --accent:#ffa500;--accent2:#c63b00;
  --green:#34d399;--red:#f87171;--blue:#60a5fa;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;
     font-size:14px;margin:0;padding:16px}

.sec-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
           letter-spacing:1.2px;margin-bottom:10px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
      padding:18px;position:relative;overflow:hidden;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;line-height:1.3}

.aviso{background:rgba(255,165,0,.07);border:1px solid rgba(255,165,0,.3);border-radius:12px;
       padding:12px 14px;font-size:12px;line-height:1.5;color:var(--muted);margin-bottom:14px}
.aviso.perigo{background:rgba(248,113,113,.07);border-color:rgba(248,113,113,.35)}
.aviso.perigo b{color:var(--red)}

.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);
             text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
input,select{width:100%;background:var(--card);border:1px solid var(--border-ctrl);color:var(--text);
  padding:10px 12px;border-radius:10px;font-size:13px;font-family:'Montserrat',sans-serif;
  outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--accent)}

.tag{font-size:9px;font-weight:700;color:var(--muted2);background:var(--card);
     border:1px solid var(--border);border-radius:4px;padding:1px 5px;text-transform:uppercase;
     letter-spacing:.4px;margin-left:4px}
.hint{font-size:10.5px;color:var(--muted2);margin-top:6px;line-height:1.5}

.btn{width:100%;background:var(--accent);border:none;color:#0f0f0f;padding:13px;border-radius:12px;
     font-family:'Montserrat',sans-serif;font-size:14px;font-weight:800;cursor:pointer;
     margin-top:6px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{background:var(--border-ctrl);color:var(--muted2);cursor:default;filter:none}
.btn-go{background:var(--accent2);color:#fff}
.btn-copy{background:var(--card);color:var(--muted);border:1px solid var(--border-ctrl);
          font-size:12px;font-weight:700;padding:10px}
.btn-copy:hover{filter:none;border-color:var(--muted2);color:var(--text)}

.produto{font-size:13px;font-weight:700;line-height:1.4;word-break:break-word;margin-bottom:8px}
.meta{font-size:11px;color:var(--muted)}
.meta .loja{color:var(--accent);font-weight:700}

.send-ok{font-size:12px;color:var(--green);font-weight:700;text-align:center;
         min-height:16px;margin-top:12px;line-height:1.5}
.send-ok.send-err{color:var(--red)}
.send-ok.neutro{color:var(--muted)}
.some{display:none}
</style>
</head>
<body>

<div class="sec-label">Disparo direto</div>

<div class="card">
  <div class="produto" id="nome">Cadastrando na base…</div>
  <div class="meta" id="meta">—</div>
</div>

<div id="form" class="some">
  <div class="card">
    <div class="card-title" style="margin-bottom:14px">Como enviar</div>

    <div class="field">
      <label>Cupom</label>
      <select id="modo">
        <option value="auto">Melhor cupom &mdash; o que der maior desconto</option>
        <option value="fixo">Escolher um cupom desta loja</option>
        <option value="nenhum">Sem cupom</option>
      </select>
    </div>

    <div class="field some" id="wrapCupom">
      <label>Qual cupom</label>
      <select id="cupom"></select>
      <div class="hint" id="hintCupom"></div>
    </div>

    <div class="field" style="margin-bottom:0">
      <label>Começar às <span class="tag">opcional</span></label>
      <input id="hora" type="time"/>
      <div class="hint">Só hoje. Horário já vencido dispara na hora.</div>
    </div>
  </div>

  <div class="aviso perigo">
    Sai para os grupos de verdade e <b>não tem desfazer</b>. Depois de começar,
    só dá para cancelar o que ainda não saiu.
  </div>

  <button class="btn btn-go" id="disparar">🚀 Disparar</button>
  <button class="btn btn-copy" id="sair">Deixar só cadastrado e fechar</button>
  <button class="btn btn-copy" id="remover">Remover da base e fechar</button>
</div>

<p class="send-ok neutro" id="estado"></p>
<button class="btn btn-copy some" id="cancelar">✕ Cancelar o que ainda não saiu</button>

<script src="disparo.js"></script>
</body>
</html>
