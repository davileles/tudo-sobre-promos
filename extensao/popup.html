<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<style>
@font-face{
  font-family:'Montserrat';
  src:url('fontes/montserrat.woff2') format('woff2');
  font-weight:400 900; font-style:normal; font-display:swap;
}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--card:#222222;
  --border:#2e2e2e;--border-ctrl:#3a3a3a;
  --text:#f5f5f5;--muted:#888888;--muted2:#666666;
  --accent:#ffa500;--red:#f87171;
}
*{box-sizing:border-box}
body{width:340px;margin:0;padding:16px;background:var(--bg);color:var(--text);
     font-family:'Montserrat',sans-serif;font-size:13px}
.sec-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
           letter-spacing:1.2px;margin-bottom:4px}
.sub{color:var(--muted2);font-size:11px;margin-bottom:12px}
ul{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
li{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--border)}
.nome{flex:1;line-height:1.35;word-break:break-word;font-size:12px;font-weight:500}
.loja{color:var(--muted2);font-size:10px;margin-top:3px;font-weight:700;
      text-transform:uppercase;letter-spacing:.4px}
.x{background:none;border:0;color:var(--muted2);cursor:pointer;font-size:14px;padding:0 2px;line-height:1}
.x:hover{color:var(--red)}
.vazio{color:var(--muted2);font-size:11.5px;line-height:1.65;padding:8px 0}
.acoes{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;background:var(--accent);border:none;color:#0f0f0f;padding:10px;border-radius:12px;
     font-family:'Montserrat',sans-serif;font-size:12px;font-weight:800;cursor:pointer;
     transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn-copy{background:transparent;border:1px solid rgba(255,165,0,.4);color:var(--accent)}
</style>
</head>
<body>
  <div class="sec-label">Captura TSP</div>
  <div class="sub" id="sub">—</div>
  <ul id="lista"></ul>
  <div class="acoes">
    <button class="btn" id="abrir">Abrir painel</button>
    <button class="btn btn-copy" id="limpar">Limpar fila</button>
  </div>
<script src="popup.js"></script>
</body>
</html>
