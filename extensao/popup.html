<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<style>
@font-face{
  font-family:'Montserrat';
  src:url('fontes/montserrat.woff2') format('woff2');
  font-weight:400 900; font-style:normal; font-display:swap;
}
:root{
  --bg:#12141c;--surface:#1a1d28;--card:#232838;
  --border:#2e3348;--border-ctrl:#3c4256;
  --text:#f5f6fa;--muted:#8b92a8;--muted2:#666d85;
  --accent:#fa5150;--red:#f87171;
}
*{box-sizing:border-box}
body{width:340px;margin:0;padding:16px;background:var(--bg);color:var(--text);
     font-family:'Montserrat',sans-serif;font-size:13px}
.sec-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
           letter-spacing:1.2px;margin-bottom:4px}
.sub{color:var(--muted2);font-size:11px;margin-bottom:12px}
ul{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
li{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--border)}
.nome{flex:1;line-height:1.35;word-break:break-word;font-size:12px;font-weight:500}
.loja{color:var(--muted2);font-size:10px;margin-top:3px;font-weight:700;
      text-transform:uppercase;letter-spacing:.4px}
.x{background:none;border:0;color:var(--muted2);cursor:pointer;font-size:14px;padding:0 2px;line-height:1}
.x:hover{color:var(--red)}
.vazio{color:var(--muted2);font-size:11.5px;line-height:1.65;padding:8px 0}
.acoes{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;background:var(--accent);border:none;color:#0f0f0f;padding:10px;border-radius:12px;
     font-family:'Montserrat',sans-serif;font-size:12px;font-weight:800;cursor:pointer;
     transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn-copy{background:transparent;border:1px solid rgba(255,165,0,.4);color:var(--accent)}
.rodape{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);
        color:var(--muted2);font-size:10px;letter-spacing:.3px;
        display:flex;justify-content:space-between;gap:8px}
.rodape b{color:var(--muted);font-weight:700}
.ml{margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.ml .linha{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.ml label{font-size:11.5px;color:var(--muted)}
.ml select,.ml input[type=text],.ml input[type=password]{background:var(--surface);color:var(--text);border:1px solid var(--border-ctrl);
  border-radius:8px;padding:6px 8px;font-family:'Montserrat',sans-serif;font-size:11.5px;width:190px}
.ml .status{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px;word-break:break-word}
.ml .status b{color:var(--text)}
.ml .ok{color:#6ee7a8}.ml .ruim{color:var(--red)}
.ml .mini{display:flex;gap:8px;margin-top:8px}
.ml .mini .btn{padding:7px;font-size:11px}
.toggle{position:relative;width:38px;height:22px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--border-ctrl);border-radius:22px;transition:.15s}
.toggle span:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span:before{transform:translateX(16px)}
</style>
</head>
<body>
  <div class="sec-label">Captura Tica</div>
  <div class="sub" id="sub">—</div>
  <ul id="lista"></ul>
  <div class="acoes">
    <button class="btn" id="abrir">Abrir painel</button>
    <button class="btn btn-copy" id="limpar">Limpar fila</button>
  </div>
  <div class="ml">
    <div class="linha">
      <div class="sec-label" style="margin:0">Cupons do Mercado Livre</div>
      <label class="toggle" title="Ligar/desligar a inserção pela extensão"><input type="checkbox" id="ml-ligado"><span></span></label>
    </div>
    <div class="linha"><label for="ml-modo">Modo</label>
      <select id="ml-modo">
        <option value="aprovar">Perguntar antes de inserir</option>
        <option value="auto">Automático</option>
      </select></div>
    <div class="linha"><label for="ml-token">Token da extensão</label>
      <input type="password" id="ml-token" placeholder="CUPONS_ML_EXTENSAO_TOKEN" autocomplete="off"></div>
    <div class="status" id="ml-status">—</div>
    <div class="mini">
      <button class="btn" id="ml-salvar">Salvar</button>
      <button class="btn btn-copy" id="ml-agora">Verificar agora</button>
    </div>
  </div>
  <div class="rodape">
    <span>v<b id="versao">—</b></span>
    <span id="dominio">—</span>
  </div>
<script src="popup.js"></script>
</body>
</html>
