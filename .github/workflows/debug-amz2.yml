name: Debug Amazon itens (temporário)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - env:
          AMAZON_COOKIE: ${{ secrets.AMAZON_COOKIE }}
        run: node debug-amz2.js
