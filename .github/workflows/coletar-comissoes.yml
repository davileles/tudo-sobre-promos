name: Comissões de Afiliados (20h)

on:
  schedule:
    # 23:00 UTC = 20:00 SP. NÃO adiante para a madrugada: o relatório de
    # cliques da Shopee só consolida o dia anterior às 17h30, e antes disso
    # devolve 0 — rodando às 06h o campo cliques da Shopee vem sempre vazio.
    # Amazon e ML já estão prontos desde a meia-noite; quem manda no horário
    # é a Shopee.
    - cron: '0 23 * * *'
  workflow_dispatch: {}

# Duas rodadas simultâneas gravando o mesmo JSON via API produzem lost update.
concurrency:
  group: coletar-comissoes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Coletar comissões do dia anterior
        env:
          AMAZON_COOKIE: ${{ secrets.AMAZON_COOKIE }}
          ML_COOKIE: ${{ secrets.ML_COOKIE }}
          SHOPEE_COOKIE: ${{ secrets.SHOPEE_COOKIE }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          GH_TOKEN_DADOS: ${{ secrets.GH_TOKEN_DADOS }}
        run: node coletar-comissoes.js
