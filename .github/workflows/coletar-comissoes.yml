name: Comissões de Afiliados (madrugada + 20h)

on:
  schedule:
    # Duas rodadas por dia, ambas mirando o dia anterior (D-1).
    #
    # 04:30 UTC = 01:30 SP — Amazon e Mercado Livre já fecharam o dia à
    # meia-noite, então o número deles entra cedo. A Shopee ainda não publicou
    # os cliques (só saem às 17h30) e a comissão pode vir zerada; nada disso
    # congela: cliques ausentes viram null e foto zerada é reescrita enquanto
    # o dia estiver na janela de revisão.
    - cron: '30 4 * * *'
    # 23:00 UTC = 20:00 SP — rodada que fecha a Shopee (cliques + comissão).
    # Para Amazon e ML esta rodada só revisa o que já estava gravado.
    - cron: '0 23 * * *'
  workflow_dispatch: {}

# Duas rodadas simultâneas gravando o mesmo JSON via API produzem lost update.
concurrency:
  group: coletar-comissoes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Coletar comissões do dia anterior
        env:
          AMAZON_COOKIE: ${{ secrets.AMAZON_COOKIE }}
          ML_COOKIE: ${{ secrets.ML_COOKIE }}
          SHOPEE_COOKIE: ${{ secrets.SHOPEE_COOKIE }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          GH_TOKEN_DADOS: ${{ secrets.GH_TOKEN_DADOS }}
          AWIN_TOKEN: ${{ secrets.AWIN_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
        run: node coletar-comissoes.js
