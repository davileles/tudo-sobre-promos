name: Debug ML por link (temporário)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - env:
          ML_COOKIE: ${{ secrets.ML_COOKIE }}
        run: node debug-ml.js
